<body>
  <script>
    async function loadBearMath() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } catch (error) {
        console.warn('Could not remove an outdated Flutter service worker.', error);
      }

      try {
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(
            cacheNames
              .filter((cacheName) => cacheName.startsWith('flutter-'))
              .map((cacheName) => caches.delete(cacheName)),
          );
        }
      } catch (error) {
        console.warn('Could not remove an outdated Flutter cache.', error);
      }

      const script = document.createElement('script');
      script.src = 'main.dart.js?release=mobile-responsive-20260809';
      script.type = 'application/javascript';
      document.body.appendChild(script);
    }

    loadBearMath();
  </script>
